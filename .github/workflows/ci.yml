name: CI Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.module }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        module:
          - currency-exchange-service
          - currency-conversion-microservice

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Temurin JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Build and verify with Maven
        run: mvn -B -ntp -f ${{ matrix.module }}/pom.xml verify
      - name: Build Docker image
        run: docker build --tag "${{ matrix.module }}:ci" "./${{ matrix.module }}"